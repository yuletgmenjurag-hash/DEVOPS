name: CI-CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ejecutar pruebas automaticas
        run: npm test

  imagen-docker:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen Docker
        run: docker build -t devops-tareas .

  notificar:
    needs: [pruebas, imagen-docker]
    if: always()
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Avisar resultado al canal (opcional)
        if: env.WEBHOOK != ''
        run: |
          if [ "${{ needs.pruebas.result }}" = "success" ] && [ "${{ needs.imagen-docker.result }}" = "success" ]; then MSG="Build exitoso en ${{ github.repository }}"; else MSG="Build FALLIDO en ${{ github.repository }}"; fi
          curl -H "Content-Type: application/json" -d "{\"content\":\"$MSG\"}" "$WEBHOOK"
